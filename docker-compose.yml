services:
  postgres:
    image: postgres:16-alpine
    container_name: emailshield-postgres
    environment:
      POSTGRES_USER: emailshield
      POSTGRES_PASSWORD: emailshield
      POSTGRES_DB: emailshield
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emailshield -d emailshield"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: emailshield-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: emailshield-api
    env_file:
      - ./api/.env.example
    environment:
      DATABASE_URL: postgresql://emailshield:emailshield@postgres:5432/emailshield
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  website:
    image: node:22-alpine
    container_name: emailshield-website
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 -p 3000"
    volumes:
      - ./website:/app
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  admin:
    image: node:22-alpine
    container_name: emailshield-admin
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./admin:/app
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started
    profiles:
      - fullstack

volumes:
  postgres_data:
  redis_data:
